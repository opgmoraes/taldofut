<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tal do Fut ⚽</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"/>
</head>
<body>
<div class="home-wrap">
  <div class="home-inner">
    <span class="home-ball">⚽</span>
    <h1 class="home-title">TAL DO <span>FUT</span></h1>
    <p class="home-sub">Organize o jogo dos seus amigos</p>

    <div class="home-cards">
      <a href="admin.html" class="home-card card-admin">
        <span class="hc-icon">🛠</span>
        <div>
          <div class="hc-title">Painel Admin</div>
          <div class="hc-desc">Crie eventos, gerencie jogadores,<br>pagamentos e sorteio de times.</div>
        </div>
        <span class="hc-arrow">→</span>
      </a>
      <a href="lista.html" class="home-card card-player">
        <span class="hc-icon">👟</span>
        <div>
          <div class="hc-title">Área do Jogador</div>
          <div class="hc-desc">Entre na lista, confirme presença<br>e veja os times sorteados.</div>
        </div>
        <span class="hc-arrow">→</span>
      </a>
    </div>

    <p class="home-footer">Dados em tempo real · Supabase ☁️</p>
  </div>
</div>
</body>
</html>
